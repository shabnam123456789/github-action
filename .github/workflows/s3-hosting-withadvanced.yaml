name: Security Scan, Build and S3 Upload

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "payment-services/**"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - "payment-services/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Select the environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - production

      version:
        description: "Enter the application version"
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: payment-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_PATH: payment-services
  AWS_REGION: ap-south-1

jobs:
  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-and-test:
    name: Build and Test
    needs: security-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: payment-services

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: payment-services/pom.xml

      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      - name: Run SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-${{ inputs.version || github.sha }}
          path: payment-services/target/*.jar
          if-no-files-found: error
          retention-days: 7


  upload-artifact-to-s3:
    name: Upload Artifact to S3
    needs:
      - security-scanning
      - build-and-test

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: ${{ inputs.environment || 'dev' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: payment-service-${{ inputs.version || github.sha }}
          path: application

      - name: Display downloaded files
        run: find application -type f -maxdepth 2 -print

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity
        run: aws sts get-caller-identity

      - name: Verify S3 bucket access
        run: |
          aws s3api head-bucket \
            --bucket "${{ vars.S3_BUCKET_NAME }}"

      - name: Upload JAR to S3
        run: |
          aws s3 sync \
            ./application \
            "s3://${{ vars.S3_BUCKET_NAME }}/${{ inputs.environment || 'dev' }}/${{ inputs.version || github.sha }}/"

      - name: Verify uploaded artifact
        run: |
          aws s3 ls \
            "s3://${{ vars.S3_BUCKET_NAME }}/${{ inputs.environment || 'dev' }}/${{ inputs.version || github.sha }}/"
