name: Payment Service CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            ${{ secrets.ECR_REGISTRY }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/payment-service:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.ECR_REGISTRY }}/payment-service:${{ github.sha }}

      - name: Trigger Repo B
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          repository: my-org/ecommerce-deployment
          event-type: deploy-payment
          client-payload: |
            {
              "service": "payment-service",
              "image_tag": "${{ github.sha }}"
            }
