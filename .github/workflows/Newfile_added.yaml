name: New Files Added

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "payment-services/**"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "payment-services/**"

permissions:
  contents: read

jobs:
  check-new-files:
    runs-on: ubuntu-latest

    outputs:
      new_files: ${{ steps.changes.outputs.new_files }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for newly added files
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          NEW_FILES=$(git diff \
            --name-only \
            --diff-filter=A \
            "$BASE" "${{ github.sha }}" \
            -- "payment-services/**")

          echo "New files:"
          echo "$NEW_FILES"

          if [ -n "$NEW_FILES" ]; then
            echo "new_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_files=false" >> "$GITHUB_OUTPUT"
          fi


  build-and-test:
    needs: check-new-files

    if: needs.check-new-files.outputs.new_files == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payment-services

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: payment-services/pom.xml

      - name: Build and Test
        run: mvn --batch-mode clean verify
